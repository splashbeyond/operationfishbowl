name: MVP Verification

on:
  push:
    branches:
      - mvp
  pull_request:
    branches:
      - mvp

jobs:
  mvp-checks:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Run MVP preflight
        run: Scripts/run_mvp_preflight.sh
